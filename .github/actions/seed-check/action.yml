name: Seed check
description: Boot wp-env for a Pediment client theme, seed it, and assert the front page renders.

inputs:
  theme-path:
    description: Path to the client theme directory (containing .wp-env.json).
    required: false
    default: "."
  plugin-source:
    description: >-
      Optional path to a locally built plugin directory (one whose basename is `pediment-plugin`,
      the slug wp-env derives from the released pediment-plugin.zip URL — the scaffolded env:start
      activates that slug). When set, it replaces the pinned release URL in .wp-env.json so a PR
      tests its own plugin build. A directory, not a zip — wp-env's local-path support for
      directories is the well-trodden path, and the monorepo's own .wp-env.json already relies on it.
    required: false
    default: ""
  assert-block:
    description: >-
      Optional block name (e.g. "ci-blocks/example-notice") to assert is registered with
      WP_Block_Type_Registry. Checked after the convergence re-seed and before the
      environment is torn down — this action owns the environment's lifecycle, so the
      check has to run inside it or it queries a container that no longer exists. Empty
      (the default) skips the check entirely.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Report the pinned Pediment versions
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: |
        node -e "const p=require('./package.json').pediment||{};console.log('template:',p.template||'unknown','plugin:',p.plugin||'unknown')"

    - name: Point wp-env at the locally built plugin
      if: inputs.plugin-source != ''
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      env:
        PLUGIN_SOURCE: ${{ inputs.plugin-source }}
      run: |
        node -e "
          const fs = require('node:fs');
          const env = JSON.parse(fs.readFileSync('.wp-env.json', 'utf8'));
          let replaced = 0;
          env.plugins = env.plugins.map((p) => {
            if (!/pediment-plugin\.zip/.test(p)) return p;
            replaced += 1;
            return process.env.PLUGIN_SOURCE;
          });
          if (replaced === 0) {
            console.error('::error::No .wp-env.json plugin entry matched pediment-plugin.zip, so the local plugin build was never swapped in. This job would have tested the released plugin instead.');
            process.exit(1);
          }
          fs.writeFileSync('.wp-env.json', JSON.stringify(env, null, 2) + '\n');
          console.log(JSON.stringify(env.plugins, null, 2));
        "

    - name: Install and boot
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: |
        set -euo pipefail
        npm install
        if [ -d src/blocks ]; then
          echo "Client blocks present — building before boot."
          npm run build
        else
          echo "No client blocks — nothing to build."
        fi
        npm run env:start

    - name: Configure languages
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: |
        if grep -q "'languages'" seed/manifest.php; then
          npm run languages
        else
          echo "Monolingual manifest — skipping wp pediment languages."
        fi

    - name: Show the seed plan
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: npm run seed:plan

    - name: Seed
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: npm run seed

    - name: Assert the front page renders
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: |
        set -euo pipefail
        status=$(curl -s -o /tmp/front.html -w '%{http_code}' http://localhost:8888/)
        echo "HTTP $status"
        test "$status" = "200"
        grep -q "<body" /tmp/front.html
        if grep -qi "There has been a critical error" /tmp/front.html; then
          echo "::error::The front page rendered a WordPress critical error."
          exit 1
        fi
        if grep -qi "Template part has been deleted or is unavailable" /tmp/front.html; then
          echo "::error::The front page rendered with a missing template part — the header did not resolve."
          exit 1
        fi

    - name: Assert every language serves its own front page
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      # Polylang names each language's home URL (it follows the permalink
      # setting, so nothing here assumes ?lang= or /en/) and the front page's
      # translation in that language. A language root that serves the default
      # language's page, or a language Polylang never got, fails here: the
      # seed itself reports neither.
      run: |
        set -euo pipefail
        if ! grep -q "'languages'" seed/manifest.php; then
          echo "Monolingual manifest — skipping."
          exit 0
        fi
        raw="$(npx wp-env run cli wp eval 'if ( ! function_exists( "pll_languages_list" ) ) { echo "NO_", "POLYLANG"; return; } $front = (int) get_option( "page_on_front" ); foreach ( pll_languages_list( array( "fields" => "" ) ) as $l ) { echo "LANG:", $l->slug, ":", str_replace( "_", "-", $l->locale ), ":", (int) pll_get_post( $front, $l->slug ), ":", pll_home_url( $l->slug ), "\n"; }')"
        if printf '%s\n' "${raw}" | grep -q 'NO_POLYLANG'; then
          echo "::notice::Polylang is not active — the per-language front-page check covers Polylang only."
          exit 0
        fi
        langs="$(printf '%s\n' "${raw}" | grep -oE 'LANG:[a-z_-]+:[A-Za-z-]+:[0-9]+:https?://[^[:space:]]*' || true)"
        echo "${langs}"
        count=0
        while IFS=: read -r _ slug lang id url; do
          count=$((count + 1))
          if [ "${id}" = "0" ]; then
            echo "::error::Language ${slug} has no translation of the front page."
            exit 1
          fi
          status=$(curl -s -o /tmp/front-${slug}.html -w '%{http_code}' "${url}")
          echo "${slug}: ${url} -> HTTP ${status}"
          test "${status}" = "200"
          if ! grep -q "<html[^>]* lang=\"${lang}\"" /tmp/front-${slug}.html; then
            echo "::error::${url} does not render <html lang=\"${lang}\"."
            exit 1
          fi
          if ! grep -qE "<body[^>]* class=\"[^\"]*\bpage-id-${id}\b" /tmp/front-${slug}.html; then
            echo "::error::${url} does not serve the ${slug} front page (post ${id})."
            exit 1
          fi
        done <<< "${langs}"
        if [ "${count}" -lt 2 ]; then
          echo "::error::The manifest declares languages, but Polylang reports ${count}."
          exit 1
        fi

    - name: Re-seed and assert the plan is now empty of content writes
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      # Assert on the seeder's own summary line rather than re-deriving its verb
      # list. Reporter::summaryLine() counts every plan item that writes
      # (plugin/src/Seeder/Reporter.php); since 4.0 the seeder only creates, so
      # "0 to write," means everything the manifest declares exists.
      run: |
        set -euo pipefail
        npm run seed:plan | tee /tmp/replan.txt
        if ! grep -qE '(^|[[:space:]])0 to write,' /tmp/replan.txt; then
          echo "::error::A second dry run still wants to write — the seeder is not converging."
          exit 1
        fi

    - name: Assert the client block registered
      if: inputs.assert-block != ''
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      env:
        ASSERT_BLOCK: ${{ inputs.assert-block }}
      # Runs before "Stop wp-env" deliberately: that step tears the container down
      # (docker compose down, not a pause), so a check placed after it would be
      # asserting against an environment that no longer exists and would fail on
      # every run regardless of whether the block registered.
      #
      # WP_DEBUG/WP_DEBUG_LOG/SCRIPT_DEBUG are all on in the client template's
      # .wp-env.json, so a PHP notice reaching stdout during `wp eval` could land
      # ahead of our own output. A sentinel-prefixed token, extracted with grep -o,
      # survives that noise; a bare string-equality on the whole captured stdout
      # would not.
      run: |
        set -euo pipefail
        raw="$(npx wp-env run cli wp eval "echo 'BLOCK_CHECK:' . (WP_Block_Type_Registry::get_instance()->is_registered('${ASSERT_BLOCK}') ? 'yes' : 'no');")"
        echo "wp eval raw output:"
        echo "${raw}"
        result="$(printf '%s\n' "${raw}" | grep -o 'BLOCK_CHECK:[a-z]*' | tail -n1 | cut -d: -f2)"
        echo "Block registration check: ${result}"
        if [ "${result}" != "yes" ]; then
          echo "::error::Block ${ASSERT_BLOCK} is not registered in WordPress — the with-blocks scaffold did not build or register it."
          exit 1
        fi

    - name: Stop wp-env
      if: always()
      shell: bash
      working-directory: ${{ inputs.theme-path }}
      run: npm run env:stop
