name: Build release zip

# Reusable workflow: checks out a tag, builds the JS bundle, patches the
# version into style.css + package.json, packs pediment.zip via rsync +
# .distignore, and uploads it to the matching GitHub Release.
#
# Called from release-please.yml (automatic on release-please-published
# tags) and release.yml (workflow_dispatch fallback for re-attaching).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build pediment.zip for (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install Composer prod deps (PUC) into vendor/
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # No build step here: blocks + the block build moved into plugin/ (Task 5,
      # plugin-absorbs-theme migration). The theme zip is pure PHP/template
      # source now; `npm run build` is redundant with the plugin build below.

      - name: Patch version into style.css and package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^(Version:[[:space:]]+).+$/\1$VERSION/" style.css
          VERSION="$VERSION" node -e "const p=require('./package.json');p.version=process.env.VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          grep -E "^Version:" style.css
          grep '"version"' package.json

      # Asset filename is intentionally version-less. wp-env derives both the
      # cache-dir name and the mounted theme slug from the URL basename (after
      # stripping trailing numeric segments), so `pediment-X.Y.Z.zip` would be
      # served as `wp-content/themes/pediment-X/`, breaking child themes that
      # `Template: pediment`. The version still travels in the URL path
      # (`/releases/download/v<X.Y.Z>/pediment.zip`).
      - name: Build distributable zip
        run: |
          STAGE="$(mktemp -d)/pediment"
          mkdir -p "$STAGE"
          rsync -a --exclude-from=.distignore ./ "$STAGE/"
          ( cd "$(dirname "$STAGE")" && zip -rq "$GITHUB_WORKSPACE/pediment.zip" pediment )
          unzip -l "pediment.zip" | tail -5

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" pediment.zip --clobber

      # ---- plugin: pediment-ai.zip ----
      - name: Build plugin
        run: |
          composer install --no-dev --prefer-dist --no-progress -d plugin
          cd plugin && npm ci && npm run build

      - name: Stamp plugin version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^ \* Version: .*/ * Version:           ${VERSION}/" plugin/plugin.php
          sed -i "s/define( 'PEDIMENT_AI_VERSION', '[^']*' )/define( 'PEDIMENT_AI_VERSION', '${VERSION}' )/" plugin/plugin.php
          cd plugin && npm pkg set version="${VERSION}"

      - name: Stage and zip plugin
        run: |
          mkdir -p stage-plugin/pediment-ai
          rsync -a --exclude-from=plugin/.distignore plugin/ stage-plugin/pediment-ai/
          cd stage-plugin && zip -rq ../pediment-ai.zip pediment-ai

      - name: Attach plugin zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" pediment-ai.zip --clobber
