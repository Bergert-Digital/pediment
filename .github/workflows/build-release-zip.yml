name: Build release zip

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build pediment-plugin.zip for (e.g. v3.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build plugin
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress -d plugin
          cd plugin && npm ci && npm run build

      - name: Stamp plugin version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^ \* Version: .*/ * Version:           ${VERSION}/" plugin/plugin.php
          sed -i "s/define( 'PEDIMENT_AI_VERSION', '[^']*' )/define( 'PEDIMENT_AI_VERSION', '${VERSION}' )/" plugin/plugin.php
          cd plugin && npm pkg set version="${VERSION}"

      - name: Stage and zip plugin
        run: |
          mkdir -p stage-plugin/pediment
          rsync -a --exclude-from=plugin/.distignore plugin/ stage-plugin/pediment/
          cd stage-plugin && zip -rq ../pediment-plugin.zip pediment
          unzip -l ../pediment-plugin.zip | tail -5

      - name: Upload plugin zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" pediment-plugin.zip --clobber
