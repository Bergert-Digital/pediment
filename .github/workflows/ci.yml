name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: composer lint -d plugin

  lint-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: cd plugin && npm ci
      - run: npm run lint:blocks
      - run: npm run lint:colors
      - run: npm run lint:icons
      - run: npm run lint:js
      - run: node tools/generate-wpml-config.mjs --check

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: npm ci
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: cd plugin && npm ci && npm run build
      - run: npm run env:start
      - run: npx wp-env run tests-wordpress --env-cwd=wp-content/plugins/pediment-ai ./vendor/bin/phpunit
      - run: npx wp-env run tests-wordpress --env-cwd=wp-content/plugins/pediment-ai ./vendor/bin/phpunit -c phpunit-polylang.xml.dist
      - if: always()
        run: npm run env:stop

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: npm ci
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: cd plugin && npm ci && npm run build
      - run: cd plugin && npx playwright install --with-deps chromium
      - run: npm run env:start
      - run: cd plugin && npm run e2e
      - if: always()
        run: npm run env:stop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: plugin/playwright-report/
