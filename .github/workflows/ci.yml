name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: composer lint -d plugin

  lint-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: cd plugin && npm ci
      - run: npm run lint:blocks
      - run: npm run lint:colors
      - run: npm run lint:icons
      - run: npm run lint:js
      - run: npm run test:kit
      - run: node tools/generate-wpml-config.mjs --check

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: npm ci
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: cd plugin && npm ci && npm run build
      - run: npm run env:start
      - run: npx wp-env run tests-wordpress --env-cwd=wp-content/plugins/pediment-ai ./vendor/bin/phpunit
      - run: npx wp-env run tests-wordpress --env-cwd=wp-content/plugins/pediment-ai ./vendor/bin/phpunit -c phpunit-polylang.xml.dist
      - if: always()
        run: npm run env:stop

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - run: npm ci
      - run: composer install --prefer-dist --no-progress -d plugin
      - run: cd plugin && npm ci && npm run build
      - run: cd plugin && npx playwright install --with-deps chromium
      - run: npm run env:start
      - run: cd plugin && npm run e2e
      - if: always()
        run: npm run env:stop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: plugin/playwright-report/

  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - answers: client-kit/tests/fixtures/answers-ci.json
            slug: pediment-ci-client
            flags: ""
            assert-block: ""
          - answers: client-kit/tests/fixtures/answers-blocks.json
            slug: ci-blocks
            flags: "--with-blocks"
            assert-block: "ci-blocks/example-notice"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Stage the plugin this PR would ship
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress -d plugin
          cd plugin && npm ci && npm run build && cd ..
          # Basename must be `pediment-plugin`: that is the slug wp-env derives from the
          # released pediment-plugin.zip URL (it renames the zip's inner dir to the URL
          # basename), and the scaffolded env:start runs `wp plugin activate pediment-plugin`.
          # Staging under any other name would test a slug real installs never produce.
          mkdir -p stage-plugin/pediment-plugin
          rsync -a --exclude-from=plugin/.distignore plugin/ stage-plugin/pediment-plugin/
          ls stage-plugin/pediment-plugin/plugin.php

      - name: Scaffold a client site from the template
        run: |
          set -euo pipefail
          git config --global user.email "ci@pediment.invalid"
          git config --global user.name "Pediment CI"
          node client-kit/scripts/scaffold.mjs \
            --answers ${{ matrix.answers }} \
            --target "$RUNNER_TEMP/${{ matrix.slug }}" \
            --template client-template \
            ${{ matrix.flags }}

      - name: Seed it and assert it renders
        uses: ./.github/actions/seed-check
        with:
          theme-path: ${{ runner.temp }}/${{ matrix.slug }}
          plugin-source: ${{ github.workspace }}/stage-plugin/pediment-plugin
          assert-block: ${{ matrix.assert-block }}

      - name: Upload the scaffolded site on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scaffolded-client-${{ matrix.slug }}
          path: ${{ runner.temp }}/${{ matrix.slug }}
