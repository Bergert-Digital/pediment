name: Client theme release

# Called by a scaffolded client repo on a pushed v* tag:
#
#   jobs:
#     release:
#       uses: Bergert-Digital/pediment/.github/workflows/client-release.yml@main
#       with:
#         tag: ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      tag:
        description: The tag being released (e.g. v1.4.0).
        required: true
        type: string

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the client theme
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check out Pediment's tooling
        uses: actions/checkout@v4
        with:
          repository: Bergert-Digital/pediment
          ref: main
          path: .pediment-tools
          sparse-checkout: tools

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve the theme slug from style.css
        id: slug
        run: |
          set -euo pipefail
          SLUG=$(node -e "
            const css = require('node:fs').readFileSync('style.css', 'utf8');
            const m = css.match(/^Text Domain:\s*(.+)$/m);
            if (!m) { console.error('style.css has no Text Domain header'); process.exit(1); }
            process.stdout.write(m[1].trim());
          ")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Theme slug: $SLUG"

      - name: Stamp the version header
        env:
          TAG: ${{ inputs.tag }}
        run: node .pediment-tools/tools/stamp-theme-version.mjs . "$TAG"

      - name: Verify the header actually moved
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          grep -qxF "Version: ${VERSION}" style.css
          echo "style.css Version header is ${VERSION}"

      - name: Build client blocks
        # `npm install`, not `npm ci`: the scaffolder deliberately commits no
        # lockfile (client-kit/scripts/scaffold.mjs writes package.json and
        # commits, but never installs), so a scaffolded repo's first release
        # has no package-lock.json for `npm ci` to require. seed-check already
        # uses `npm install` for the same repos; a theme's dependency surface
        # is two @wordpress/* devDependencies, so lockfile-exact
        # reproducibility isn't what's at stake here.
        run: |
          set -euo pipefail
          if [ -d src/blocks ]; then
            npm install
            npm run build
          else
            echo "No client blocks — nothing to build."
          fi

      - name: Stage and zip
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        # `seed/` MUST ship — the seeder reads seed/manifest.php and seed/media/
        # from the active theme at runtime, and the wp-admin Seeding tab is the
        # only way to re-seed on admin-only hosting.
        #
        # `docs/` MUST NOT — docs/brief.md is a per-client business brief, and a
        # theme directory is web-servable, so shipping it publishes positioning
        # and audience notes at a predictable URL. `AGENTS.md` and `package.json`
        # are excluded to match plugin/.distignore, which strips the plugin's
        # equivalents for the same reason: nothing at runtime reads them.
        #
        # `build/` MUST ship and `src/` MUST NOT: WordPress loads built blocks
        # from build/blocks, and the sources are dead weight in a theme
        # directory that is web-servable. `build/` is gitignored, which is why
        # the build step above runs before this one.
        #
        # Every name in ROOT_EXCLUDES means the theme ROOT only: each becomes a
        # leading-slash rsync pattern. An unanchored `--exclude 'docs'` matches
        # a folder of that name at any depth, and until 2026-11-27 it silently
        # dropped softbox's assets/docs/merkblatt-datenschutz.pdf. Only `.git`
        # and `node_modules` stay unanchored: they are junk at every depth.
        run: |
          set -euo pipefail
          ROOT_EXCLUDES=(
            .github
            .pediment-tools
            stage
            .wp-env.json
            .wp-env.override.json
            package.json
            package-lock.json
            docs
            AGENTS.md
            src
          )
          ARGS=(--exclude '.git' --exclude 'node_modules')
          for name in "${ROOT_EXCLUDES[@]}"; do
            ARGS+=(--exclude "/${name}")
          done
          mkdir -p "stage/${SLUG}"
          rsync -a "${ARGS[@]}" ./ "stage/${SLUG}/"
          (cd stage && zip -rq "../${SLUG}.zip" "${SLUG}")
          unzip -l "${SLUG}.zip" | tail -5

          # Fail when a file git tracks outside ROOT_EXCLUDES is not in the
          # staged tree that `zip -r` packed, so an exclude can never again
          # drop a shipped file silently. Submodule entries (mode 160000) are
          # directories, not files.
          MISSING=$(
            git -c core.quotePath=false ls-files -s \
              | awk -F'\t' '$1 !~ /^160000 / { print $2 }' \
              | while IFS= read -r path; do
                  top="${path%%/*}"
                  for name in "${ROOT_EXCLUDES[@]}"; do
                    [ "$top" = "$name" ] && continue 2
                  done
                  case "/${path}/" in (*/.git/*|*/node_modules/*) continue ;; esac
                  [ -e "stage/${SLUG}/${path}" ] || printf '%s\n' "$path"
                done
          )
          if [ -n "$MISSING" ]; then
            echo "::error::Tracked files are missing from ${SLUG}.zip:"
            printf '%s\n' "$MISSING"
            exit 1
          fi
          echo "Every tracked file outside the excluded roots is in ${SLUG}.zip."

      # `gh release upload` does NOT create a release — it fails with "release not
      # found". The documented client flow is a bare `git push --tags`, which
      # creates a tag and nothing else, so the release has to be created here.
      # The plugin's own pipeline never needed this because release-please
      # creates the GitHub Release before build-release-zip.yml runs.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            echo "Creating release $TAG."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.slug.outputs.slug }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "${SLUG}.zip" --clobber
